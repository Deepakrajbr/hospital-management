apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: {{ .Values.auth.replicas }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: {{ .Values.auth.image }}
          ports:
            - containerPort: {{ .Values.auth.port }}
          env:
            - name: PORT
              value: "{{ .Values.auth.port }}"
            - name: MONGO_URI
              value: "mongodb://mongodb:27017/auth-db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hospital-secret
                  key: JWT_SECRET
