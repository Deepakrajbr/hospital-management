services:

  mongodb:
    image: mongo:8
    container_name: mongodb
    volumes:
      - mongo-data:/data/db

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/auth-db
      JWT_SECRET: supersecretkey
    depends_on:
      - mongodb

volumes:
  mongo-data: