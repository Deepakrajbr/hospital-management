apiVersion: apps/v1
kind: Deployment

metadata:
  name: doctor-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: doctor-service

  template:
    metadata:
      labels:
        app: doctor-service

    spec:
      containers:
        - name: doctor-service

          image: deepakraj172004/doctor-service:v1

          ports:
            - containerPort: 5002

          env:
            - name: PORT
              value: "5002"

            - name: MONGO_URI
              value: "mongodb://doctor-mongodb:27017/doctor-db"