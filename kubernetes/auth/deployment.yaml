apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: deepakraj172004/auth-service:latest

          ports:
            - containerPort: 5001

          env:
            - name: PORT
              value: "5001"

            - name: MONGO_URI
              value: "mongodb://mongodb:27017/auth-db"

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hospital-secret
                  key: JWT_SECRET