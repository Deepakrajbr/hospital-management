apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway

          image: deepakraj172004/gateway:v1

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: GATEWAY_PORT

            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: AUTH_SERVICE_URL

            - name: DOCTOR_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: DOCTOR_SERVICE_URL