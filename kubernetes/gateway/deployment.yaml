apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway

spec:
  replicas: 2

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway

          image: deepakraj172004/gateway:v1

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

            - name: AUTH_SERVICE_URL
              value: "http://auth-service:5001"

            - name: DOCTOR_SERVICE_URL
              value: "http://doctor-service:5002"